<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class=" flex justify-center items-center h-screen">
   
 <div class="w-1/5 p-8 rounded-xl bg-white shadow-xl">
        <h3 class="text-center font-bold text-2xl my-5">Login Form</h3>

        <form>
            <label for="username">Username:</label>
            <input type="text" class="text-input" required>
        
            <label for="password">Password:</label>
            <input type="password" class="text-input" required>
        
            <button type="submit" class="btn">Login</button>

        <p class="link">
            <a href="singup.html">Don't have an account? Sign up</a>
        </p>            
        
        </form>
    </div>

  </body>
</html>
